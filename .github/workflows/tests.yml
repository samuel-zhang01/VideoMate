name: Synthetic tests
# Broad/native tests remain an explicit checkpoint, never a push/PR trigger.
on:
  workflow_dispatch:
    inputs:
      include_hosted:
        description: Opt in to potentially paid hosted Windows and Linux ARM coverage
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: synthetic-checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    if: github.ref == 'refs/heads/main' && github.repository == 'samuel-zhang01/VideoMate'
    runs-on: [deploy-vps, videomate]
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: targets
        env:
          INCLUDE_HOSTED: ${{ inputs.include_hosted }}
        run: python3 tools/ci_support.py matrix --kind tests --repo "$GITHUB_REPOSITORY" --include-hosted "$INCLUDE_HOSTED" >> "$GITHUB_OUTPUT"
  tests:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: matrix.hosted
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Prepare checksum-pinned disposable local Python and Tk
        if: '!matrix.hosted'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            /opt/homebrew/bin/python3.13 tools/ci_support.py runtime --python "$PYTHON_VERSION"
          else
            python3 tools/ci_support.py runtime --python "$PYTHON_VERSION"
          fi
      - name: Check source-only Git index
        run: python tools/check_repository.py
      - name: Provision pinned public native backend
        if: matrix.python == '3.13'
        run: python tools/install_ffmpeg.py
      - name: Verify local Linux virtual display is installed
        if: runner.os == 'Linux' && !matrix.hosted
        run: command -v xvfb-run
      - name: Prepare disposable hosted Linux display
        if: runner.os == 'Linux' && matrix.hosted
        run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
      - name: Select generated-media test executables
        if: matrix.python == '3.13'
        shell: python
        run: |
          import os
          from videomate.dependencies import load_bundle
          bundle = load_bundle()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('ffmpeg', 'ffprobe'):
                  output.write('VIDEOMATE_TEST_' + name.upper() + '=' + str(getattr(bundle, name)) + '\n')
              output.write('VIDEOMATE_TEST_GUI=1\n')
      - name: Test with full synthetic inputs and isolated native display
        run: python tools/ci_support.py test
      - name: Check Windows offline launcher
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: .\start.bat --offline --check
      - name: Check Unix offline launcher
        if: runner.os != 'Windows' && matrix.python == '3.13'
        run: python tools/ci_support.py exec -- sh start.sh --offline --check
      - name: Build offline development archive
        run: python tools/build_zipapp.py
      - name: Smoke test archive
        run: python dist/videomate.pyz --version
      - name: Remove only this job's disposable Python and Tk
        if: always() && !matrix.hosted
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            /opt/homebrew/bin/python3.13 tools/ci_support.py cleanup
          else
            /usr/bin/python3 tools/ci_support.py cleanup
          fi
