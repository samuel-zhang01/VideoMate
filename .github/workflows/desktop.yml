name: Native offline desktops
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            architecture: x64
          - os: macos-15
            platform: macos-arm64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      VIDEOMATE_TEST_GUI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Check native architecture
        run: python -c "from videomate.dependencies import platform_tag; assert platform_tag() == '${{ matrix.platform }}'"
      - name: Install build dependencies
        run: python -m pip install -r tools/requirements-build.txt
      - name: Provision pinned public software
        run: python tools/install_ffmpeg.py --platform ${{ matrix.platform }}
      - name: Configure generated-media tests
        shell: python
        run: |
          import os
          from pathlib import Path
          suffix = '.exe' if os.name == 'nt' else ''
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('ffmpeg', 'ffprobe'):
                  path = Path('dependencies/ffmpeg/${{ matrix.platform }}/bin/' + name + suffix).resolve()
                  output.write('VIDEOMATE_TEST_' + name.upper() + '=' + str(path) + '\n')
      - name: Test source GUI and recovery with generated media
        run: python -m unittest discover -s tests -v
      - name: Check source launcher offline
        shell: python
        run: |
          import os, subprocess
          command = ['start.bat', '--offline', '--check'] if os.name == 'nt' else ['sh', 'start.sh', '--offline', '--check']
          subprocess.run(command, shell=os.name == 'nt', check=True)
      - name: Build and test bundled GUI
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: videomate-${{ matrix.platform }}-desktop
          path: |
            dist/*-desktop.zip
            dist/*-desktop.zip.sha256
          if-no-files-found: error
          retention-days: 14
