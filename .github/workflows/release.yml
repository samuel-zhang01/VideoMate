name: Build release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.6.1)
        required: true
        type: string
      include_hosted:
        description: Opt in to potentially paid hosted Windows and Linux ARM builds
        type: boolean
        default: false
      create_draft:
        description: Create a draft prerelease only after all four platforms pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  matrix:
    if: github.ref == 'refs/heads/main' && github.repository == 'samuel-zhang01/VideoMate'
    runs-on: [deploy-vps, videomate]
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: targets
        env:
          INCLUDE_HOSTED: ${{ inputs.include_hosted }}
        run: python3 tools/ci_support.py matrix --kind release --repo "$GITHUB_REPOSITORY" --include-hosted "$INCLUDE_HOSTED" >> "$GITHUB_OUTPUT"
  packages:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: matrix.hosted
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Prepare checksum-pinned disposable local Python and Tk
        if: '!matrix.hosted'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            /opt/homebrew/bin/python3.13 tools/ci_support.py runtime --python 3.13
          else
            python3 tools/ci_support.py runtime --python 3.13
          fi
      - name: Validate tag, platform and source index
        shell: python
        run: |
          import os, subprocess, sys
          from videomate import __version__
          from videomate.dependencies import platform_tag
          assert os.environ['RELEASE_TAG'] == 'v' + __version__
          assert os.environ['RELEASE_PLATFORM'] == platform_tag()
          subprocess.run([sys.executable, 'tools/check_repository.py'], check=True)
      - name: Prepare public pinned dependencies
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tools/install_ffmpeg.py'], check=True)
          subprocess.run([sys.executable, 'tools/install_python.py', '--platform', os.environ['RELEASE_PLATFORM'], '--online'], check=True)
      - name: Prepare hosted Linux display
        if: runner.os == 'Linux' && matrix.hosted
        run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
      - name: Verify local Linux virtual display is installed
        if: runner.os == 'Linux' && !matrix.hosted
        run: command -v xvfb-run
      - name: Configure generated-media tests
        shell: python
        run: |
          import os
          from videomate.dependencies import load_bundle
          bundle = load_bundle()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('ffmpeg', 'ffprobe'):
                  output.write('VIDEOMATE_TEST_' + name.upper() + '=' + str(getattr(bundle, name)) + '\n')
              output.write('VIDEOMATE_TEST_GUI=1\n')
      - name: Test full native source with isolated synthetic display
        run: python tools/ci_support.py test
      - name: Build runtime kit
        shell: python
        run: |
          import os, subprocess, sys
          from videomate import __version__
          subprocess.run([sys.executable, 'tools/build_zipapp.py'], check=True)
          kit = 'dist/videomate-' + __version__ + '-' + os.environ['RELEASE_PLATFORM'] + '-runtime-kit.zip'
          subprocess.run([sys.executable, 'tools/build_offline_bundle.py', '--platform', os.environ['RELEASE_PLATFORM'], '--include-runtime', '--output', kit], check=True)
          command = [sys.executable, 'tools/verify_kit.py', kit, '--execute']
          if sys.platform == 'linux':
              command = ['xvfb-run', '-a'] + command
          subprocess.run([sys.executable, 'tools/ci_support.py', 'exec', '--', *command], check=True)
      - name: Build native desktop
        if: matrix.desktop
        run: |
          python -m pip install -r tools/requirements-build.txt
          python tools/ci_support.py exec -- python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*-desktop.zip
            dist/*-desktop.zip.sha256
            dist/*-runtime-kit.zip
            dist/*-runtime-kit.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's disposable Python and Tk
        if: always() && !matrix.hosted
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            /opt/homebrew/bin/python3.13 tools/ci_support.py cleanup
          else
            /usr/bin/python3 tools/ci_support.py cleanup
          fi
  draft:
    if: inputs.include_hosted && inputs.create_draft
    needs: packages
    runs-on: [deploy-vps, videomate]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and create a draft prerelease
        shell: bash
        run: |
          python3 tools/verify_release_assets.py release-assets
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --verify-tag --draft --prerelease --title "VideoMate $RELEASE_TAG" --notes-file docs/release-notes.md
